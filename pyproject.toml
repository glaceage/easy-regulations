[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-regulations"
version = "0.1.0"
description = "Policy revision platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "httpx",
    "python-multipart",
    "pyyaml",
    "openai",
    "boto3",
    "arq",
    "python-jose",
    "passlib[bcrypt]",
    "bcrypt>=4.0.0,<4.1.0",
    "weasyprint",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "aiosqlite",
    "greenlet",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
